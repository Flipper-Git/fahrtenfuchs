name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fahrtenfuchs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish/update "dev" release with APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev app/build/outputs/apk/debug/app-debug.apk --clobber
            gh release edit dev --notes "Automatischer Build von Commit ${{ github.sha }}" --target "${{ github.sha }}"
          else
            gh release create dev app/build/outputs/apk/debug/app-debug.apk \
              --title "Laufender Debug-Build (main)" \
              --notes "Automatischer Build von Commit ${{ github.sha }}" \
              --target "${{ github.sha }}"
          fi
