name: Build offline routing graph (Schweiz)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System info
        run: |
          nproc
          free -h
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download GraphHopper 11.0
        run: curl -fsSL -o graphhopper-web.jar "https://github.com/graphhopper/graphhopper/releases/download/11.0/graphhopper-web-11.0.jar"

      - name: Download Switzerland OSM extract
        run: curl -fsSL -o switzerland-latest.osm.pbf "https://download.geofabrik.de/europe/switzerland-latest.osm.pbf"

      - name: Copy build config
        run: cp routing-build/config.yml .

      - name: Import (build routing graph)
        run: |
          mkdir -p janino-generated
          java -Xmx12g \
            -Dorg.codehaus.janino.source_debugging.enable=true \
            -Dorg.codehaus.janino.source_debugging.dir=janino-generated \
            -Ddw.graphhopper.datareader.file=switzerland-latest.osm.pbf \
            -jar graphhopper-web.jar import config.yml

      - name: Package graph-cache
        run: |
          ls -la graph-cache
          du -sh graph-cache
          zip -r -q graph-cache-schweiz.zip graph-cache

      - name: Upload generated Janino weighting source
        uses: actions/upload-artifact@v7
        with:
          name: janino-generated
          path: janino-generated

      - name: Publish/update routing-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete routing-data-ch --yes --cleanup-tag || true
          gh release create routing-data-ch graph-cache-schweiz.zip \
            --title "Offline-Routing-Graph Schweiz (GraphHopper)" \
            --notes "Automatisch gebaut aus switzerland-latest.osm.pbf, Commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
