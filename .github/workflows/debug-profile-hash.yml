name: Debug - dump resolved profile content/hash

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download GraphHopper 11.0
        run: curl -fsSL -o graphhopper-web.jar "https://github.com/graphhopper/graphhopper/releases/download/11.0/graphhopper-web-11.0.jar"

      - name: Write DumpProfile.java
        run: |
          cat > DumpProfile.java << 'EOF'
          import com.graphhopper.GraphHopper;
          import com.graphhopper.config.Profile;
          import com.graphhopper.util.Jackson;
          import com.graphhopper.util.JsonFeatureCollection;
          import com.fasterxml.jackson.databind.ObjectMapper;
          import java.util.List;

          public class DumpProfile {
              public static void main(String[] args) throws Exception {
                  ObjectMapper om = Jackson.newObjectMapper();
                  // exactly mirrors what YAML parsing produces for our config.yml profile entry
                  Profile p = om.readValue(
                      "{\"name\":\"car\",\"custom_model_files\":[\"car.json\"]}",
                      Profile.class);
                  System.out.println("RAW CONTENT: " + p);
                  System.out.println("RAW VERSION: " + p.getVersion());
                  List<Profile> resolved = GraphHopper.resolveCustomModelFiles("", List.of(p), new JsonFeatureCollection());
                  Profile rp = resolved.get(0);
                  System.out.println("RESOLVED CONTENT: " + rp);
                  System.out.println("RESOLVED VERSION: " + rp.getVersion());
              }
          }
          EOF

      - name: Compile and run
        run: |
          javac -cp graphhopper-web.jar DumpProfile.java
          java -cp graphhopper-web.jar:. DumpProfile
