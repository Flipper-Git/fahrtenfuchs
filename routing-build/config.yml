graphhopper:
  datareader.file: ""
  graph.location: graph-cache

  profiles:
    - name: car
      custom_model_files: [car.json]

  profiles_ch:
    - profile: car
  profiles_lm: []

  graph.encoded_values: car_access, car_average_speed, road_access

  import.osm.ignored_highways: footway,construction,cycleway,path,steps
  # RAM_STORE würde auf Android abstürzen (RAMDataAccess nutzt eine VarHandle-Methode,
  # die Androids java.lang.invoke.VarHandle nicht implementiert). MMAP nutzt nur
  # Standard-ByteBuffer und funktioniert dort einwandfrei.
  graph.dataaccess.default_type: MMAP

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 1000000

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  appenders:
    - type: console
